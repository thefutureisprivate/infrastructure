---
- name: "Inspect the atomic boot marker"
  ansible.builtin.stat:
    path: "/run/ostree-booted"
  register: "silverblue_ostree_boot"

- name: "Read the operating-system identity"
  ansible.builtin.slurp:
    src: "/etc/os-release"
  register: "silverblue_os_release_file"

- name: "Validate the Silverblue host"
  vars:
    silverblue_os_release: "{{ silverblue_os_release_file.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - "ansible_facts.distribution == 'Fedora'"
      - "silverblue_ostree_boot.stat.exists"
      - >-
        'VARIANT_ID=silverblue' in silverblue_os_release
        or 'VARIANT_ID="silverblue"' in silverblue_os_release
    fail_msg: "This playbook only supports a booted Fedora Silverblue host."

- name: "Validate the automatic-update policy"
  ansible.builtin.assert:
    that:
      - "silverblue_automatic_update_policy in ['none', 'check', 'stage']"
    fail_msg: "Use none, check, or stage; automatic reboots are intentionally unsupported."

- name: "Validate package-layer declarations"
  ansible.builtin.assert:
    that:
      - "silverblue_layered_packages | length == silverblue_layered_packages | unique | length"
      - "silverblue_absent_layered_packages | length == silverblue_absent_layered_packages | unique | length"
      - "silverblue_layered_packages | intersect(silverblue_absent_layered_packages) | length == 0"
      - "silverblue_removed_base_packages | length == silverblue_removed_base_packages | unique | length"
      - "silverblue_layered_packages | intersect(silverblue_removed_base_packages) | length == 0"
      - "item is match('^[A-Za-z0-9][A-Za-z0-9+_.:-]*$')"
    fail_msg: "Package names must be unique, safe command arguments, and present in only one state list."
  loop: >-
    {{ silverblue_layered_packages
       + silverblue_absent_layered_packages
       + silverblue_removed_base_packages }}
  loop_control:
    label: "{{ item }}"

- name: "Validate the OpenTofu RPM repository declaration"
  ansible.builtin.assert:
    that:
      - "silverblue_opentofu_repository.file == '/etc/yum.repos.d/opentofu.repo'"
      - >-
        silverblue_opentofu_repository.baseurl
        == 'https://packages.opentofu.org/opentofu/tofu/rpm_any/rpm_any/$basearch'
      - "silverblue_opentofu_repository.release_key.url == 'https://get.opentofu.org/opentofu.asc'"
      - >-
        silverblue_opentofu_repository.repository_key.url
        == 'https://packages.opentofu.org/opentofu/tofu/gpgkey'
      - "silverblue_opentofu_repository.release_key.sha256 is match('^[0-9a-f]{64}$')"
      - "silverblue_opentofu_repository.repository_key.sha256 is match('^[0-9a-f]{64}$')"
      - >-
        silverblue_opentofu_repository.release_key.path
        == '/etc/pki/rpm-gpg/RPM-GPG-KEY-opentofu.asc'
      - >-
        silverblue_opentofu_repository.repository_key.path
        == '/etc/pki/rpm-gpg/RPM-GPG-KEY-opentofu-repository'
    fail_msg: "OpenTofu must use the official HTTPS RPM repository and checksum-pinned signing keys."

- name: "Validate the pinned SOPS binary declaration"
  ansible.builtin.assert:
    that:
      - "ansible_facts.architecture == 'x86_64'"
      - "silverblue_sops.version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')"
      - >-
        silverblue_sops.url
        == 'https://github.com/getsops/sops/releases/download/v'
           ~ silverblue_sops.version
           ~ '/sops-v'
           ~ silverblue_sops.version
           ~ '.linux.amd64'
      - "silverblue_sops.sha256 is match('^[0-9a-f]{64}$')"
      - "silverblue_sops.path == '/usr/local/bin/sops'"
    fail_msg: "SOPS must use the exact checksum-pinned upstream x86_64 release binary."

- name: "Validate Flatpak remote declarations"
  ansible.builtin.assert:
    that:
      - "item.name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')"
      - "item.state | default('present') in ['present', 'absent']"
      - "item.state | default('present') == 'absent' or item.flatpakrepo_url is defined"
      - "item.state | default('present') == 'absent' or item.flatpakrepo_url is match('^https://')"
      - "item.state | default('present') == 'absent' or item.expected_url is defined"
      - "item.state | default('present') == 'absent' or item.expected_url is match('^https://')"
    fail_msg: "Present Flatpak remotes require a safe name and HTTPS repository and effective URLs."
  loop: "{{ silverblue_flatpak_remotes }}"
  loop_control:
    label: "{{ item.name | default('invalid remote') }}"

- name: "Validate unique Flatpak remote declarations"
  ansible.builtin.assert:
    that:
      - >-
        silverblue_flatpak_remotes | map(attribute='name') | list | length
        == silverblue_flatpak_remotes | map(attribute='name') | unique | list | length
    fail_msg: "Each Flatpak remote may be declared only once."

- name: "Validate Flatpak application declarations"
  vars:
    silverblue_present_flatpak_remote_names: >-
      {{ (silverblue_flatpak_remotes | selectattr('state', 'undefined') | list
          | union(silverblue_flatpak_remotes
                  | selectattr('state', 'defined')
                  | selectattr('state', 'equalto', 'present')
                  | list))
         | map(attribute='name')
         | list }}
  ansible.builtin.assert:
    that:
      - "item.name is match('^[A-Za-z][A-Za-z0-9_-]*(\\.[A-Za-z0-9_-]+){2,}$')"
      - "item.state | default('present') in ['present', 'absent']"
      - "item.state | default('present') == 'absent' or item.remote is defined"
      - "item.state | default('present') == 'absent' or item.remote in silverblue_present_flatpak_remote_names"
    fail_msg: "Present Flatpaks require an application ID and a declared present remote."
  loop: "{{ silverblue_flatpaks }}"
  loop_control:
    label: "{{ item.name | default('invalid Flatpak') }}"

- name: "Validate unique Flatpak application declarations"
  ansible.builtin.assert:
    that:
      - >-
        silverblue_flatpaks | map(attribute='name') | list | length
        == silverblue_flatpaks | map(attribute='name') | unique | list | length
    fail_msg: "Each Flatpak application may be declared only once."

- name: "Validate Silverblue hardening declarations"
  ansible.builtin.assert:
    that:
      - "silverblue_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]{0,63}$')"
      - "silverblue_network_mac_randomization in ['random', 'stable', 'stable-ssid']"
      - "silverblue_firewall_zone is match('^[A-Za-z0-9_-]{1,17}$')"
      - "silverblue_firewall_services | length == silverblue_firewall_services | unique | length"
      - "silverblue_masked_units | length == silverblue_masked_units | unique | length"
      - "silverblue_blocked_kernel_modules | length == silverblue_blocked_kernel_modules | unique | length"
      - "silverblue_kernel_arguments | length == silverblue_kernel_arguments | unique | length"
      - "silverblue_intel_kernel_arguments | length == silverblue_intel_kernel_arguments | unique | length"
      - "silverblue_amd_kernel_arguments | length == silverblue_amd_kernel_arguments | unique | length"
      - "silverblue_chrony_nts_servers | length >= 3"
      - "silverblue_faillock_deny | int >= 3"
      - "silverblue_faillock_interval | int >= 60"
      - "silverblue_faillock_unlock_time | int >= 60"
    fail_msg: "The Silverblue hardening profile contains an invalid or duplicate declaration."
  when: "silverblue_hardening_enabled"

- name: "Validate hardening list values"
  ansible.builtin.assert:
    that:
      - "item is match('^[A-Za-z0-9][A-Za-z0-9_.@:-]*$')"
    fail_msg: "Hardening service, unit, module, and NTS names must be safe configuration values."
  loop: >-
    {{ silverblue_firewall_services
       + silverblue_masked_units
       + silverblue_blocked_kernel_modules
       + silverblue_chrony_nts_servers }}
  loop_control:
    label: "{{ item }}"
  when: "silverblue_hardening_enabled"

- name: "Validate kernel argument values"
  ansible.builtin.assert:
    that:
      - "item is match('^[A-Za-z0-9][A-Za-z0-9_.=,-]*$')"
    fail_msg: "Kernel arguments must be single, safe command-line tokens."
  loop: >-
    {{ silverblue_kernel_arguments
       + silverblue_intel_kernel_arguments
       + silverblue_amd_kernel_arguments }}
  loop_control:
    label: "{{ item }}"
  when: "silverblue_hardening_enabled"

- name: "Validate sysctl hardening values"
  ansible.builtin.assert:
    that:
      - "item.key is match('^[A-Za-z0-9_.*-]+$')"
      - "item.value | string is match('^[A-Za-z0-9_./|, -]+$')"
    fail_msg: "Sysctl names and values must be safe single-line configuration values."
  loop: "{{ silverblue_sysctl_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: "silverblue_hardening_enabled"
